<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Dubly Studio</title><link rel="stylesheet" href="/static/studio.css"></head><body>
<div id="loading-screen" hidden></div>
<div id="studio" class="draft-loading">
<header class="studio-header"><a href="/" class="logo" aria-label="Dubly 홈">Dubly</a><div class="project-heading"><h1 id="project-name" data-no-i18n></h1><span id="save-state">저장됨</span></div><div class="header-actions"><button id="undo" type="button" aria-label="실행 취소" title="실행 취소 (Ctrl+Z)" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4-5 4 5 4M3 8h8a5 5 0 0 1 5 5v3"/></svg></button><button id="redo" type="button" aria-label="다시 실행" title="다시 실행 (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4 5 4-5 4m5-4H9a5 5 0 0 0-5 5v3"/></svg></button><button id="open-player" type="button">플레이어</button><button id="save">저장</button><a id="download" hidden>MP4 다운로드 ↗</a><button id="export" class="primary"><span>MP4 내보내기</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M5 4h7v7"/></svg></button></div></header>
<div id="message" role="status" aria-live="polite"></div><div class="work-progress" id="work-progress" role="status" aria-live="polite"><div id="work-bar"></div><span id="work-status">대본을 준비하고 있습니다</span><button id="loading-retry" type="button" hidden>다시 시도</button></div>
<main class="studio-layout"><section class="script-pane"><div class="pane-toolbar"><div><h2>대사 편집</h2><span id="dialogue-count"></span></div><input id="search" type="search" placeholder="대사 검색…" aria-label="대사 검색"></div><div class="script-actions"><button id="generate-stale" type="button" title="재생성이 필요하거나 아직 생성되지 않은 대사만 생성합니다." disabled>필요한 음성 모두 생성 (0)</button></div><div id="dialogues"></div></section><div id="panel-resize" class="panel-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-label="대사 패널 너비 조절"></div>
<aside class="preview-pane"><div class="video-frame"><video id="video" playsinline preload="metadata"></video><div class="preview-placeholder skeleton" aria-hidden="true"></div></div><div class="player-controls"><button id="player-play" type="button" aria-label="영상 재생 또는 일시정지"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="play-symbol" d="m7 4 9 6-9 6Z"/></svg></button><span id="time-display">00:00 / 00:00</span><div class="player-volume"><button id="player-mute" type="button" aria-label="음소거 전환"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-4v12l-4-4H3ZM13 6c3 2 3 6 0 8"/></svg></button><input id="player-volume" type="range" min="0" max="1" step=".01" value="1" aria-label="재생 볼륨"></div></div><div class="preview-mode"><button id="mode-source" aria-pressed="false">원본</button><button id="mode-dub" aria-pressed="true">더빙</button><span id="preview-status" role="status">자동 미리듣기</span></div><audio id="preview-audio" preload="metadata" hidden></audio>
</aside></main>
<div id="timeline-resize" class="timeline-resize" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="타임라인 높이 조절" aria-valuemin="140" aria-valuemax="800"><span></span></div><section class="timeline-section"><div class="timeline-toolbar"><div><strong>타임라인</strong><span>양끝: 길이 조절 · 가운데: 이동 · 발화 경계에 자동 맞춤 · Alt: 해제</span></div><div><button id="toggle-play" aria-label="영상 재생 또는 일시정지">▶</button><label>확대<input id="zoom" type="range" min="0.2" max="40" value="2" step=".2" aria-label="타임라인 확대"></label></div></div><div class="timeline-scroll" id="timeline-scroll"><div class="timeline-placeholder" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="timeline-content"><canvas id="timeline" height="230" aria-label="원본 파형 및 더빙 클립 타임라인" tabindex="0"></canvas><div id="speaker-tracks" role="group" tabindex="0" aria-label="화자 트랙 · 우클릭으로 화자 ID 추가"></div><div id="timeline-playhead" aria-hidden="true"><i></i></div></div></div></section>
<div id="timeline-menu" role="menu" hidden></div><span id="timeline-tip" role="status" hidden></span><footer>ALPHA TEST · 편집 내용은 저장 후 반영됩니다. 음성을 바꾸려면 해당 대사를 다시 생성하세요.</footer>
</div><dialog id="speaker-dialog" aria-labelledby="speaker-title"><form id="speaker-form"><h2 id="speaker-title">화자 ID 추가</h2><label>화자 ID<input id="new-speaker-id" maxlength="64" required autocomplete="off"></label><p id="speaker-error" role="alert"></p><div class="add-actions"><button id="cancel-speaker" type="button">취소</button><button type="submit" class="primary">추가</button></div></form></dialog><dialog id="add-dialog" aria-labelledby="add-title"><form id="add-form"><h2 id="add-title">대사 추가</h2><div class="add-fields"><label>시작 · 초<input id="add-start" type="number" min="0" step=".01" required></label><label>끝 · 초<input id="add-end" type="number" min="0" step=".01" required></label><label>화자 ID<input id="add-speaker" type="text" maxlength="64" required></label></div><label>원문 전사<textarea id="add-source" maxlength="8000" required></textarea></label><label>번역 대사<textarea id="add-target" maxlength="8000" required></textarea></label><p id="add-error" role="alert"></p><div class="add-actions"><button id="cancel-add" type="button">취소</button><button type="submit" class="primary">추가</button></div></form></dialog><dialog id="clip-dialog" aria-labelledby="clip-name"><button id="close-clip" type="button" aria-label="오디오 편집 닫기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button><section id="audio-editor" hidden><div class="clip-heading"><h2 id="clip-name">오디오 편집</h2><div><button id="play-reference">원음 듣기</button><button id="play-edited">편집 음성 듣기</button></div></div>
<p id="clip-status"></p><div class="wave-area"><canvas id="clip-wave" height="150" tabindex="0" aria-label="생성 음성 파형: 양끝 자르기, 쉼 구간을 드래그해 길이 조절"></canvas><div id="wave-tip" hidden></div></div>
<p class="wave-guide">양끝 핸들: 자르기 · 쉼 영역: 좌우 드래그로 길이 조절</p>
<div class="edit-grid"><label>시작 자르기 · 초<input id="trim-start" type="number" min="0" step="0.01"></label><label>끝 자르기 · 초<input id="trim-end" type="number" min="0" step="0.01"></label><label>배치 위치 · 초<input id="clip-position" type="number" min="0" step="0.01"></label><label>가속<input id="clip-speed" type="number" min="1" max="8" step="0.05" value="1"></label></div>
<label class="speed-slider"><span>1×</span><input id="speed-slider" type="range" min="1" max="4" step="0.05" value="1" aria-label="가속 배율"><span id="speed-value">1.00×</span></label>
<div id="pause-editor" hidden><label>선택한 쉼 · 초<input id="pause-seconds" type="number" min="0.01" step="0.01"></label><button id="pause-reset">이 쉼 초기화</button></div>
<div class="clip-footer"><span id="clip-length"></span><button id="reset-audio">오디오 편집 초기화</button></div><div class="clip-transport"><button id="clip-play" type="button" aria-label="편집 음성 재생 또는 일시정지"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="clip-play-symbol" d="m7 4 9 6-9 6Z"/></svg></button><span id="clip-play-time">00:00 / 00:00</span><input id="clip-seek" type="range" min="0" max="1" value="0" step=".001" aria-label="오디오 재생 위치"><input id="clip-volume" type="range" min="0" max="1" value="1" step=".01" aria-label="오디오 볼륨"></div><audio id="clip-audio" preload="none" hidden></audio></section></dialog><script src="/static/locales.js" defer></script><script src="/static/i18n.js" defer></script><script src="/static/progress.js" defer></script><script src="/static/history.js" defer></script><script src="/static/project-share.js" defer></script><script src="/static/grid.js" defer></script><script src="/static/studio-preview.js" defer></script><script src="/static/editor-history.js" defer></script><script src="/static/studio-media.js" defer></script><script src="/static/studio.js" defer></script></body></html>
