<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플레이어 · Dubly</title><link rel="stylesheet" href="/static/studio-player.css"></head>
<body><main><header><a id="back" href="/" aria-label="편집으로 돌아가기">← 편집</a><h1 id="title">플레이어</h1><button id="refresh" type="button">최신 편집 불러오기</button></header>
<section class="screen"><video id="player" controls playsinline preload="metadata" aria-label="더빙 영상"></video><div id="loading" role="status" aria-live="polite"><span id="spinner" aria-hidden="true"></span><p id="status">영상을 준비하고 있어요.</p><button id="retry" type="button" hidden>다시 시도</button></div></section>
<footer><span id="note">저장된 편집 내용으로 재생합니다.</span><span>Space 재생 · ← → 5초 이동 · F 전체 화면</span></footer>
<section id="playlist" class="playlist" aria-labelledby="playlist-title" hidden><div class="playlist-heading"><div><h2 id="playlist-title">재생목록</h2><span id="playlist-count"></span></div><div class="playlist-controls"><label><input id="autoplay-next" type="checkbox" checked>다음 영상 자동 재생</label><button id="previous-part" type="button" aria-label="이전 영상">← 이전</button><button id="next-part" type="button" aria-label="다음 영상">다음 →</button></div></div><ol id="playlist-items"></ol><p id="playlist-note" role="status" aria-live="polite"></p></section>
</main><script src="/static/locales.js" defer></script><script src="/static/i18n.js" defer></script><script src="/static/studio-media.js" defer></script><script src="/static/video-playlist.js" defer></script><script src="/static/studio-player.js" defer></script></body></html>
